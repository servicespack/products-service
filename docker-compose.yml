services:
  mongodb:
    image: mongo:7
    container_name: products-service-mongodb
    restart: unless-stopped
    command: [--replSet, rs0, --bind_ip_all]
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
